<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPark - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <i class="fas fa-square-parking"></i>
                <span class="logo">Smart<span>Park</span></span>
            </div>
            <p class="login-subtitle">Acesso à área administrativa</p>

            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="loginEmail">E-mail</label>
                    <input class="form-input" type="email" id="loginEmail" name="email" placeholder="voce@smartpark.com" autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPassword">Senha</label>
                    <input class="form-input" type="password" id="loginPassword" name="password" placeholder="••••••••" autocomplete="current-password">
                </div>
                <p id="loginError" class="form-error">Preencha e-mail e senha para continuar.</p>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <p class="login-footnote">Autenticação ainda não integrada ao Back-end (RF pendente).</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
